<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d1c"/>
      <stop offset="100%" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="sAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="paypalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003087"/>
      <stop offset="100%" stop-color="#0079c1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#sBg)"/>

  <!-- Browser Chrome -->
  <rect x="0" y="0" width="800" height="50" rx="16" fill="#1b162c"/>
  <rect x="0" y="35" width="800" height="15" fill="#1b162c"/>
  <circle cx="30" cy="25" r="6" fill="#f43f5e"/>
  <circle cx="50" cy="25" r="6" fill="#fbbf24"/>
  <circle cx="70" cy="25" r="6" fill="#34d399"/>
  <rect x="110" y="14" width="400" height="22" rx="6" fill="#0f0c18" opacity="0.6"/>
  <text x="130" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">ssphere-fashion.store/shop</text>

  <!-- Store Header -->
  <rect x="40" y="75" width="720" height="60" rx="12" fill="#1e1832" stroke="#2e254d" stroke-width="1"/>
  <text x="60" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" letter-spacing="1">SSPHERE</text>
  <text x="175" y="111" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-style="italic">Sphere of Styles</text>

  <!-- Navigation items -->
  <text x="360" y="111" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Apparel</text>
  <text x="440" y="111" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Accessories</text>
  <text x="545" y="111" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Admin</text>

  <!-- Cart Button with counter -->
  <rect x="635" y="89" width="105" height="32" rx="8" fill="url(#sAccent)"/>
  <text x="655" y="110" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">Cart (3)</text>

  <!-- Products Showcase Grid -->
  <!-- Product 1 -->
  <g transform="translate(40, 155)">
    <rect width="225" height="305" rx="12" fill="#1a142c" stroke="#2a2046" stroke-width="1"/>
    <!-- Image placeholder area -->
    <rect x="15" y="15" width="195" height="170" rx="8" fill="#241c3e"/>
    <circle cx="112" cy="95" r="40" fill="#36295c" opacity="0.6"/>
    <text x="68" y="102" fill="#d946ef" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Urban Hoodie</text>
    <!-- Product Info -->
    <text x="18" y="210" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">Midnight Stealth Edition</text>
    <text x="18" y="230" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">₹2,499</text>
    <text x="75" y="230" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-decoration="line-through">₹3,999</text>
    <!-- Add to cart -->
    <rect x="18" y="248" width="189" height="34" rx="6" fill="#2c214d" stroke="#581c87" stroke-width="1"/>
    <text x="68" y="270" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Add to Bag</text>
  </g>

  <!-- Product 2 (Featured with PayPal badge) -->
  <g transform="translate(287, 155)">
    <rect width="225" height="305" rx="12" fill="#201838" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="15" y="15" width="195" height="170" rx="8" fill="#2d2150"/>
    <circle cx="112" cy="95" r="40" fill="#442e78" opacity="0.6"/>
    <text x="62" y="102" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Minimal Jacket</text>
    
    <!-- Badge -->
    <rect x="25" y="25" width="60" height="20" rx="4" fill="#d946ef"/>
    <text x="35" y="39" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">HOT</text>

    <!-- Product Info -->
    <text x="18" y="210" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">Cyber Streetwear Bomber</text>
    <text x="18" y="230" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">₹4,199</text>
    <!-- Quick checkout with PayPal button -->
    <rect x="18" y="248" width="189" height="34" rx="6" fill="url(#sAccent)"/>
    <text x="50" y="270" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Quick Buy / Checkout</text>
  </g>

  <!-- Order & Checkout Summary Column -->
  <g transform="translate(534, 155)">
    <rect width="226" height="305" rx="12" fill="#1a142c" stroke="#2a2046" stroke-width="1"/>
    <text x="20" y="35" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">Checkout Preview</text>
    
    <rect x="20" y="55" width="186" height="1" fill="#2d2150"/>

    <text x="20" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Subtotal:</text>
    <text x="155" y="80" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">₹6,698</text>

    <text x="20" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Tax &amp; Shipping:</text>
    <text x="165" y="105" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">FREE</text>

    <text x="20" y="135" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">Total Due:</text>
    <text x="145" y="135" fill="#d946ef" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">₹6,698</text>

    <!-- PayPal Gateway Card -->
    <rect x="18" y="160" width="190" height="60" rx="8" fill="#14192b" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="30" y="175" width="70" height="28" rx="4" fill="url(#paypalGrad)"/>
    <text x="40" y="194" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" font-style="italic">PayPal</text>
    <text x="110" y="193" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Verified Gateway</text>

    <!-- Order security badge -->
    <rect x="18" y="240" width="190" height="42" rx="6" fill="#132a24" stroke="#059669" stroke-width="1"/>
    <text x="40" y="265" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">256-Bit SSL Encrypted</text>
  </g>
</svg>
