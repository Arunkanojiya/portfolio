<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="trBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#14192b"/>
    </linearGradient>
    <linearGradient id="trPin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="trImage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#trBg)"/>

  <!-- Browser Header -->
  <rect x="0" y="0" width="800" height="50" rx="16" fill="#151d30"/>
  <rect x="0" y="35" width="800" height="15" fill="#151d30"/>
  <circle cx="30" cy="25" r="6" fill="#f43f5e"/>
  <circle cx="50" cy="25" r="6" fill="#fbbf24"/>
  <circle cx="70" cy="25" r="6" fill="#34d399"/>
  <rect x="110" y="14" width="400" height="22" rx="6" fill="#0b1120" opacity="0.6"/>
  <text x="130" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">traveldiary-memories.io/feed</text>

  <!-- Filter & Search Bar -->
  <rect x="40" y="75" width="720" height="55" rx="12" fill="#141d33" stroke="#233050" stroke-width="1"/>
  <!-- Search input -->
  <rect x="60" y="88" width="280" height="30" rx="6" fill="#0c1322" stroke="#1e293b" stroke-width="1"/>
  <text x="75" y="108" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">🔍 Search destinations, tags...</text>
  <!-- Date filter pill -->
  <rect x="360" y="88" width="160" height="30" rx="6" fill="#1e293b"/>
  <text x="375" y="107" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">📅 Oct 2024 - Dec 2024</text>
  <!-- New Memory CTA -->
  <rect x="620" y="88" width="120" height="30" rx="6" fill="#8b5cf6"/>
  <text x="640" y="108" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">+ Add Memory</text>

  <!-- Stories Stream -->
  <!-- Card 1: Pinned Story -->
  <g transform="translate(40, 150)">
    <rect width="345" height="315" rx="12" fill="#121a2d" stroke="#f59e0b" stroke-width="1.5"/>
    
    <!-- Pinned Tag -->
    <rect x="15" y="12" width="95" height="22" rx="4" fill="url(#trPin)"/>
    <text x="25" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">📌 PINNED STORY</text>
    
    <text x="240" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Nov 18, 2024</text>

    <!-- Uploaded Photo Thumbnail area -->
    <rect x="15" y="44" width="315" height="150" rx="8" fill="url(#trImage)"/>
    <!-- Mountain illustration -->
    <polygon points="60,180 140,90 220,180" fill="#334155" opacity="0.8"/>
    <polygon points="170,180 230,110 300,180" fill="#475569" opacity="0.7"/>
    <circle cx="270" cy="80" r="16" fill="#fbbf24" opacity="0.8"/>

    <!-- Story Content -->
    <text x="18" y="218" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Summit at Sunrise • Manali</text>
    <text x="18" y="238" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Chasing early morning dawn over the snowpeaks with my camera...</text>
    
    <!-- Tags -->
    <rect x="18" y="265" width="70" height="20" rx="10" fill="#1e293b"/>
    <text x="28" y="279" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">#Himachal</text>

    <rect x="95" y="265" width="60" height="20" rx="10" fill="#1e293b"/>
    <text x="105" y="279" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">#Hiking</text>
  </g>

  <!-- Card 2: Regular Story -->
  <g transform="translate(415, 150)">
    <rect width="345" height="315" rx="12" fill="#121a2d" stroke="#1e293b" stroke-width="1"/>
    
    <text x="20" y="27" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Surat • Gujarat</text>
    <text x="240" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Dec 04, 2024</text>

    <!-- Uploaded Photo area -->
    <rect x="15" y="44" width="315" height="150" rx="8" fill="url(#trImage)"/>
    <!-- Beach/River illustration -->
    <rect x="15" y="140" width="315" height="54" rx="4" fill="#0284c7" opacity="0.6"/>
    <circle cx="80" cy="90" r="22" fill="#f43f5e" opacity="0.7"/>

    <!-- Story Content -->
    <text x="18" y="218" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Dumas Beach Evening Walk</text>
    <text x="18" y="238" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Sunset breeze by the Arabian Sea, quiet reflections and city lights...</text>
    
    <!-- Tags -->
    <rect x="18" y="265" width="55" height="20" rx="10" fill="#1e293b"/>
    <text x="28" y="279" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">#Coast</text>

    <rect x="80" y="265" width="60" height="20" rx="10" fill="#1e293b"/>
    <text x="90" y="279" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">#Memories</text>
  </g>
</svg>
