<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f1a"/>
      <stop offset="100%" stop-color="#141526"/>
    </linearGradient>
    <linearGradient id="tHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#tBg)"/>

  <!-- Browser Window Chrome -->
  <rect x="0" y="0" width="800" height="50" rx="16" fill="#18192d"/>
  <rect x="0" y="35" width="800" height="15" fill="#18192d"/>
  <circle cx="30" cy="25" r="6" fill="#f43f5e"/>
  <circle cx="50" cy="25" r="6" fill="#fbbf24"/>
  <circle cx="70" cy="25" r="6" fill="#34d399"/>
  <rect x="110" y="14" width="400" height="22" rx="6" fill="#0e0f1a" opacity="0.6"/>
  <text x="130" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">taskly-mern.app/dashboard</text>

  <!-- App Header -->
  <rect x="40" y="75" width="720" height="60" rx="12" fill="#16172a" stroke="#252843" stroke-width="1"/>
  <rect x="60" y="90" width="30" height="30" rx="8" fill="url(#tHeader)"/>
  <text x="105" y="111" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">Taskly</text>
  <rect x="180" y="95" width="70" height="22" rx="11" fill="#9333ea" opacity="0.2"/>
  <text x="192" y="110" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">ADMIN</text>
  <rect x="610" y="90" width="130" height="32" rx="8" fill="url(#tHeader)"/>
  <text x="635" y="111" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">+ New Task</text>

  <!-- Kanban Columns -->
  <!-- Column 1: Backlog / To Do -->
  <g transform="translate(40, 160)">
    <rect width="226" height="300" rx="12" fill="#131424" stroke="#23253e" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">TO DO</text>
    <rect x="180" y="18" width="26" height="18" rx="9" fill="#23253e"/>
    <text x="190" y="31" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">3</text>

    <!-- Card 1 -->
    <rect x="15" y="50" width="196" height="70" rx="8" fill="#1a1c32" stroke="#2c2f4f" stroke-width="1"/>
    <text x="28" y="74" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Design API Endpoints</text>
    <rect x="28" y="88" width="45" height="18" rx="4" fill="#ef4444" opacity="0.2"/>
    <text x="35" y="101" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">High</text>

    <!-- Card 2 -->
    <rect x="15" y="130" width="196" height="70" rx="8" fill="#1a1c32" stroke="#2c2f4f" stroke-width="1"/>
    <text x="28" y="154" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">JWT Refresh Logic</text>
    <rect x="28" y="168" width="55" height="18" rx="4" fill="#eab308" opacity="0.2"/>
    <text x="35" y="181" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Medium</text>
  </g>

  <!-- Column 2: In Progress -->
  <g transform="translate(286, 160)">
    <rect width="226" height="300" rx="12" fill="#131424" stroke="#23253e" stroke-width="1"/>
    <text x="20" y="32" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">IN PROGRESS</text>
    <rect x="180" y="18" width="26" height="18" rx="9" fill="#9333ea" opacity="0.3"/>
    <text x="190" y="31" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">2</text>

    <!-- Card 1 -->
    <rect x="15" y="50" width="196" height="90" rx="8" fill="#1d1e38" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="28" y="74" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">User Role Permissions</text>
    <text x="28" y="94" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">RBAC middleware for routes</text>
    <rect x="28" y="106" width="60" height="18" rx="4" fill="#a855f7" opacity="0.25"/>
    <text x="36" y="119" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Backend</text>

    <!-- Card 2 -->
    <rect x="15" y="150" width="196" height="70" rx="8" fill="#1a1c32" stroke="#2c2f4f" stroke-width="1"/>
    <text x="28" y="174" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">React Query Cache</text>
    <rect x="28" y="188" width="60" height="18" rx="4" fill="#38bdf8" opacity="0.2"/>
    <text x="36" y="201" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Frontend</text>
  </g>

  <!-- Column 3: Completed -->
  <g transform="translate(534, 160)">
    <rect width="226" height="300" rx="12" fill="#131424" stroke="#23253e" stroke-width="1"/>
    <text x="20" y="32" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">COMPLETED</text>
    <rect x="180" y="18" width="26" height="18" rx="9" fill="#059669" opacity="0.25"/>
    <text x="190" y="31" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">5</text>

    <!-- Card 1 -->
    <rect x="15" y="50" width="196" height="70" rx="8" fill="#1a1c32" stroke="#2c2f4f" stroke-width="1"/>
    <text x="28" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">MongoDB Schema Setup</text>
    <rect x="28" y="88" width="65" height="18" rx="4" fill="#22c55e" opacity="0.2"/>
    <text x="36" y="101" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Done (100%)</text>
  </g>
</svg>
