<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18182b"/>
      <stop offset="50%" stop-color="#12121f"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="190" stroke="url(#accentGrad)" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Subtle tech grid -->
  <circle cx="200" cy="200" r="140" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="200" cy="200" r="90" stroke="#ec4899" stroke-width="1" stroke-dasharray="2 4" opacity="0.2"/>

  <!-- Glowing Aura -->
  <circle cx="200" cy="180" r="70" fill="#9333ea" opacity="0.25" filter="url(#glow)"/>

  <!-- Developer Silhouette / Stylized Avatar -->
  <!-- Shoulders -->
  <path d="M100 340 C115 270, 160 250, 200 250 C240 250, 285 270, 300 340 Z" fill="#24263e" stroke="#3b3e66" stroke-width="2"/>
  
  <!-- Hoodie neckline -->
  <path d="M165 255 L200 295 L235 255" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="180" y="215" width="40" height="45" rx="8" fill="#e2e8f0" opacity="0.9"/>

  <!-- Head -->
  <rect x="150" y="125" width="100" height="110" rx="35" fill="#f1f5f9"/>

  <!-- Hair / Cap -->
  <path d="M140 145 C140 100, 170 85, 200 85 C230 85, 260 100, 260 145 C250 140, 240 135, 220 135 C195 135, 175 140, 140 145 Z" fill="#1e1e2f"/>

  <!-- Glasses -->
  <rect x="158" y="152" width="36" height="24" rx="7" fill="#0f172a" stroke="#a855f7" stroke-width="3"/>
  <rect x="206" y="152" width="36" height="24" rx="7" fill="#0f172a" stroke="#a855f7" stroke-width="3"/>
  <line x1="194" y1="164" x2="206" y2="164" stroke="#a855f7" stroke-width="3"/>
  
  <!-- Eyes shine inside glasses -->
  <circle cx="174" cy="164" r="4" fill="#38bdf8"/>
  <circle cx="222" cy="164" r="4" fill="#38bdf8"/>

  <!-- Confident smile -->
  <path d="M185 205 Q200 215 215 205" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Code / Terminal badge floating on the side -->
  <g transform="translate(265, 185) rotate(12)">
    <rect width="90" height="50" rx="10" fill="#131422" stroke="#a855f7" stroke-width="2"/>
    <circle cx="15" cy="15" r="4" fill="#ef4444"/>
    <circle cx="27" cy="15" r="4" fill="#eab308"/>
    <circle cx="39" cy="15" r="4" fill="#22c55e"/>
    <text x="15" y="38" fill="#c084fc" font-family="monospace" font-size="14" font-weight="bold">&lt;/&gt; MERN</text>
  </g>
</svg>
